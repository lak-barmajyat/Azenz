[project]
name = "azenz"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=4.3.0",
    "pymysql[rsa]>=1.2.3",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.4",
    "reportlab>=4.4.4",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pymysql>=1.2.3",
    "ruff>=0.16.9",
    "sqlacodegen>=4.0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyside6-project]
files = [
    "main.py",
    "modules/login/Login.qml",
    "modules/login/LoginView.ui.qml",
    "modules/ventes/liste_ventes/ListeVentes.qml",
    "modules/ventes/liste_ventes/ListeVentesView.ui.qml",
    "modules/achats/liste_achats/ListeAchats.qml",
    "modules/achats/liste_achats/ListeAchatsView.ui.qml",
    "modules/ventes/nouveau_doc/NouveauDoc.qml",
    "modules/ventes/nouveau_doc/NouveauDocView.ui.qml",
    "modules/achats/nouveau_doc/NouveauDoc.qml",
    "modules/achats/nouveau_doc/NouveauDocView.ui.qml",
    "qml/theme/Theme.qml",
    "qml/theme/Colors.qml",
    "qml/theme/Typography.qml",
    "resources/resources.qrc",
]
[tool.alembic]
script_location = "%(here)s/database/migrations"
prepend_sys_path = ["."]
