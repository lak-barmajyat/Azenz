[project]
name = "azenz"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyside6-project]
files = [
    "main.py",
    "modules/login/Login.qml",
    "modules/login/LoginView.ui.qml",
    "modules/login/Login.js",
    "qml/theme/Theme.qml",
    "qml/theme/Colors.qml",
    "qml/theme/Typography.qml",
    "resources/resources.qrc",
]
